<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meus pedidos</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header><h1>Meus pedidos</h1><nav><a href="index.html">← Loja</a></nav></header>
  <main class="um"><p id="aviso"></p><div id="lista"></div></main>

  <script type="module">
    import { supabase, brl, esc, ROTULO } from "./config.js";
    const $ = id => document.getElementById(id);

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) { location.href = "login.html?volta=pedidos.html"; throw new Error("sem sessão"); }

    if (new URLSearchParams(location.search).get("novo"))
      $("aviso").textContent = "✅ Pedido enviado! Acompanhe o andamento aqui.";

    async function carregar() {
      const { data } = await supabase.from("pedidos")
        .select("*, itens_pedido(*)").order("created_at", { ascending: false });
      $("lista").innerHTML = (data || []).map(p => {
        const taxa = Number(p.taxa_entrega || 0);
        const desc = Number(p.desconto || 0);
        const sub = Number(p.total) - taxa + desc;
        return `
        <article class="card ${p.status}">
          <h3>Pedido #${p.id} — ${esc(ROTULO[p.status])}</h3>
          <small>${new Date(p.created_at).toLocaleString("pt-BR")}</small>
          <ul>${p.itens_pedido.map(i => `<li>${i.quantidade}× ${esc(i.nome)}${i.observacao ? `<br><small>📝 ${esc(i.observacao)}</small>` : ""}</li>`).join("")}</ul>
          <p>
            Produtos: ${brl(sub)}<br>
            ${desc > 0 ? `Cupom ${esc(p.cupom)}: − ${brl(desc)}<br>` : ""}
            Entrega${p.bairro ? " (" + esc(p.bairro) + ")" : ""}: ${taxa > 0 ? brl(taxa) : "grátis"}<br>
            <b>Total: ${brl(p.total)}</b> — ${esc(p.pagamento)}
          </p>
        </article>`;
      }).join("") || "<p>Você ainda não fez pedidos.</p>";
    }
    await carregar();

    // atualiza sozinho quando a loja muda o andamento do pedido
    supabase.channel("meus-pedidos")
      .on("postgres_changes", { event: "UPDATE", schema: "public", table: "pedidos" }, carregar)
      .subscribe();
  </script>
</body>
</html>
