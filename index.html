<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bebidas em casa</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header>
    <h1>🍺 Bebidas em casa</h1>
    <nav id="nav"></nav>
  </header>

  <section class="marcas">
    <div class="marca" id="marca1"><span>Casca de Bala</span></div>
    <div class="marca" id="marca2"><span>Tereza Bicuda</span></div>
  </section>

  <main class="um com-barra">
    <input id="busca" type="search" placeholder="🔍 Buscar bebida (ex.: heineken, coca, monster)">
    <div id="chips" class="chips"></div>
    <div id="produtos"></div>
  </main>

  <a id="barra" class="barra-pedido" href="carrinho.html" hidden>🛒 Ver meu pedido</a>

  <script type="module">
    import { supabase, brl, esc } from "./config.js";
    const $ = id => document.getElementById(id);

    // ordem em que as categorias aparecem na loja
    const ORDEM = ["Cervejas Lata", "Long Necks", "Cervejas Zero", "Refrigerantes",
                   "Energéticos", "Isotônicos", "Águas", "Sucos", "Outras bebidas"];
    const pos = c => { const i = ORDEM.indexOf(c); return i < 0 ? 99 : i; };

    // --- carrinho: { idDoProduto: { q: quantidade, obs: "observação do item" } } ---
    function lerCarrinho() {
      let c = {};
      try { c = JSON.parse(localStorage.getItem("carrinho") || "{}"); } catch { c = {}; }
      for (const id of Object.keys(c)) {
        if (typeof c[id] === "number") c[id] = { q: c[id], obs: "" };   // formato antigo
        if (!c[id] || !(c[id].q > 0)) delete c[id];
      }
      return c;
    }
    let carrinho = lerCarrinho();
    const salvar = () => localStorage.setItem("carrinho", JSON.stringify(carrinho));

    // --- sessão e menu ---
    const { data: { session } } = await supabase.auth.getSession();
    let perfil = null;
    if (session) {
      ({ data: perfil } = await supabase.from("profiles").select("is_admin")
        .eq("id", session.user.id).single());
    }
    $("nav").innerHTML =
      '<a href="carrinho.html" id="navCarrinho">🛒 Seu pedido</a>' +
      (perfil?.is_admin ? '<a href="admin.html">Painel</a>' : "") +
      (session
        ? '<a href="pedidos.html">Meus pedidos</a><a href="#" id="sair">Sair</a>'
        : '<a href="login.html">Entrar</a>');
    if (session) $("sair").onclick = async e => {
      e.preventDefault(); await supabase.auth.signOut(); location.reload();
    };

    // --- imagens das distribuidoras no topo ---
    const { data: cfg } = await supabase.from("configuracoes").select("*");
    const conf = Object.fromEntries((cfg || []).map(r => [r.chave, r.valor]));
    [["marca1_img", "marca1", "Casca de Bala"], ["marca2_img", "marca2", "Tereza Bicuda"]]
      .forEach(([chave, id, nome]) => {
        if (conf[chave]) $(id).innerHTML = `<img src="${esc(conf[chave])}" alt="${esc(nome)}">`;
      });

    // --- produtos ---
    const { data } = await supabase.from("produtos").select("*")
      .eq("ativo", true).order("nome");
    const produtos = data || [];

    // botão "Adicionar" ou quantidade (− 2 +) de cada cartão
    function acoes(id) {
      const l = carrinho[id];
      return l
        ? `<div class="stepper"><button data-menos="${id}">−</button><span>${l.q}</span><button data-mais="${id}">+</button></div>`
        : `<button data-mais="${id}">Adicionar</button>`;
    }

    function desenharProdutos() {
      const termo = $("busca").value.trim().toLowerCase();
      const lista = produtos.filter(p => p.nome.toLowerCase().includes(termo));
      const cats = [...new Set(lista.map(p => p.categoria || "Outros"))]
        .sort((a, b) => pos(a) - pos(b) || a.localeCompare(b));

      $("chips").innerHTML = cats.map((c, i) => `<a href="#cat-${i}">${esc(c)}</a>`).join("");
      $("produtos").innerHTML = cats.map((c, i) => `
        <h2 class="cat" id="cat-${i}">${esc(c)}</h2>
        <div class="grid">
          ${lista.filter(p => (p.categoria || "Outros") === c).map(p => `
            <article class="card">
              ${p.imagem_url ? `<div style="height:160px;background:#fff;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center"><img src="${esc(p.imagem_url)}" alt="${esc(p.nome)}" loading="lazy" decoding="async" style="max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:0"></div>` : ""}
              <h3>${esc(p.nome)}</h3>
              ${p.descricao ? `<p>${esc(p.descricao)}</p>` : ""}
              <b class="valor">${brl(p.preco)}</b>
              <div data-acoes="${p.id}">${acoes(p.id)}</div>
            </article>`).join("")}
        </div>`).join("") ||
        `<p>${produtos.length ? "Nenhuma bebida encontrada." : "Nenhum produto disponível ainda."}</p>`;
    }
    $("busca").oninput = desenharProdutos;

    // --- barra do pedido (rodapé) e contador do menu ---
    function atualizarBarra() {
      let itens = 0, total = 0;
      for (const [id, l] of Object.entries(carrinho)) {
        const p = produtos.find(x => x.id == id);
        if (!p) continue;
        itens += l.q;
        total += Number(p.preco) * l.q;
      }
      $("barra").hidden = itens === 0;
      $("barra").textContent = `🛒 Ver meu pedido · ${itens} ${itens === 1 ? "item" : "itens"} · ${brl(total)}`;
      $("navCarrinho").textContent = itens ? `🛒 Seu pedido (${itens})` : "🛒 Seu pedido";
    }

    document.addEventListener("click", e => {
      const d = e.target.dataset;
      const id = d.mais || d.menos;
      if (!id) return;
      const l = carrinho[id] || { q: 0, obs: "" };
      l.q += d.mais ? 1 : -1;
      if (l.q <= 0) delete carrinho[id]; else carrinho[id] = l;
      salvar();
      const alvo = document.querySelector(`[data-acoes="${id}"]`);
      if (alvo) alvo.innerHTML = acoes(id);
      atualizarBarra();
    });

    desenharProdutos();
    atualizarBarra();
  </script>
</body>
</html>
