<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="box" style="display:block">
    <h1>Entrar ou criar conta</h1>
    <input id="nome" placeholder="Seu nome (só para criar conta)">
    <input id="email" type="email" placeholder="E-mail">
    <input id="senha" type="password" placeholder="Senha (mínimo 6 caracteres)">
    <button id="entrar">Entrar</button>
    <button id="cadastrar" class="sec">Criar conta</button>
    <p id="msg"></p>
    <a href="index.html">← Voltar à loja</a>
  </main>

  <script type="module">
    import { supabase } from "./config.js";
    const $ = id => document.getElementById(id);
    const msg = t => ($("msg").textContent = t);

    const paginas = ["index.html", "pedidos.html", "admin.html"];
    const pedida = new URLSearchParams(location.search).get("volta");
    const volta = paginas.includes(pedida) ? pedida : "index.html";

    $("entrar").onclick = async () => {
      const { error } = await supabase.auth.signInWithPassword({
        email: $("email").value, password: $("senha").value });
      error ? msg(error.message) : (location.href = volta);
    };

    $("cadastrar").onclick = async () => {
      const { data, error } = await supabase.auth.signUp({
        email: $("email").value, password: $("senha").value,
        options: { data: { nome: $("nome").value } } });
      if (error) return msg(error.message);
      if (data.session) location.href = volta;
      else msg("Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre.");
    };
  </script>
</body>
</html>
