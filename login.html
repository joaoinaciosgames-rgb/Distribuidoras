<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entrar</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="box" style="display:block">
    <h1>Entrar ou criar conta</h1>
    <input id="nome" placeholder="Seu nome (só para criar conta)" autocomplete="name">
    <input id="email" type="email" placeholder="E-mail" autocomplete="email">
    <input id="senha" type="password" placeholder="Senha (mínimo 6 caracteres)" autocomplete="current-password">
    <button id="entrar">Entrar</button>
    <button id="cadastrar" class="sec">Criar conta</button>
    <p id="msg"></p>
    <a href="index.html">← Voltar à loja</a>
  </main>

  <script type="module">
    import { supabase } from "./config.js";
    import { traduzirErro } from "./textos.js";
    const $ = id => document.getElementById(id);
    const msg = t => ($("msg").textContent = t);

    const paginas = ["index.html", "carrinho.html", "pedidos.html", "admin.html"];
    const pedida = new URLSearchParams(location.search).get("volta");
    const volta = paginas.includes(pedida) ? pedida : "index.html";

    function conferir(precisaNome) {
      if (!$("email").value.trim()) { msg("Digite o seu e-mail."); return false; }
      if (!$("senha").value) { msg("Digite a sua senha."); return false; }
      if (precisaNome && !$("nome").value.trim()) { msg("Digite o seu nome para criar a conta."); return false; }
      return true;
    }

    async function executar(botao, tarefa) {
      botao.disabled = true;
      msg("Aguarde...");
      try { await tarefa(); } finally { botao.disabled = false; }
    }

    $("entrar").onclick = () => conferir(false) && executar($("entrar"), async () => {
      const { error } = await supabase.auth.signInWithPassword({
        email: $("email").value.trim(), password: $("senha").value });
      if (error) return msg(traduzirErro(error));
      location.href = volta;
    });

    $("cadastrar").onclick = () => conferir(true) && executar($("cadastrar"), async () => {
      const { data, error } = await supabase.auth.signUp({
        email: $("email").value.trim(), password: $("senha").value,
        options: { data: { nome: $("nome").value.trim() } } });
      if (error) return msg(traduzirErro(error));
      if (data.session) location.href = volta;
      else msg("Conta criada! Confirme pelo link enviado ao seu e-mail e depois entre.");
    });
  </script>
</body>
</html>
