<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seu pedido</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <header>
    <h1>🛒 Seu pedido</h1>
    <nav><a href="index.html">← Continuar comprando</a></nav>
  </header>

  <main class="um" style="max-width:760px">
    <p id="aviso"></p>

    <div id="vazio" class="card" hidden>
      Seu pedido está vazio. <a href="index.html">Ver as bebidas</a>
    </div>

    <div id="conteudo" hidden>
      <section class="card">
        <h2>Itens</h2>
        <div id="itens"></div>
      </section>

      <section class="card">
        <h2>Entrega</h2>
        <p><small id="info"></small></p>
        <input id="bairro" placeholder="Bairro *" autocomplete="address-level3">
        <textarea id="endereco" placeholder="Endereço (rua, número e ponto de referência) *"></textarea>
        <input id="telefone" type="tel" placeholder="Telefone / WhatsApp *">
        <input id="obs" maxlength="300" placeholder="Observação geral do pedido (ex.: troco para 100)">
        <select id="pagamento">
          <option>Pix na entrega</option>
          <option>Dinheiro</option>
          <option>Cartão na entrega</option>
        </select>
      </section>

      <section class="card">
        <h2>Cupom de desconto</h2>
        <div class="form-linha">
          <input id="cupom" placeholder="Digite o código do cupom" autocapitalize="characters">
          <button id="aplicarCupom" class="sec">Aplicar</button>
        </div>
        <small id="msgCupom"></small>
      </section>

      <section class="card">
        <p>
          Produtos: <span id="subtotal">R$ 0,00</span><br>
          <span id="linhaDesconto" hidden>Desconto: <span id="desconto"></span><br></span>
          Entrega: <span id="taxa"></span><br>
          Total: <b id="total">R$ 0,00</b>
        </p>
        <p id="minimo" style="color:var(--amarelo)"></p>
        <button id="finalizar">Finalizar pedido</button>
      </section>
    </div>
  </main>

  <script type="module">
    import { supabase, brl, esc } from "./config.js";
    import { traduzirErro } from "./textos.js";
    const $ = id => document.getElementById(id);

    // --- carrinho: { idDoProduto: { q: quantidade, obs: "observação do item" } } ---
    function lerCarrinho() {
      let c = {};
      try { c = JSON.parse(localStorage.getItem("carrinho") || "{}"); } catch { c = {}; }
      for (const id of Object.keys(c)) {
        if (typeof c[id] === "number") c[id] = { q: c[id], obs: "" };   // formato antigo
        if (!c[id] || !(c[id].q > 0)) delete c[id];
      }
      return c;
    }
    let carrinho = lerCarrinho();
    const salvar = () => localStorage.setItem("carrinho", JSON.stringify(carrinho));

    // --- taxa de entrega e pedido mínimo (definidos no painel) ---
    const num = (v, padrao) => {
      const n = parseFloat(String(v ?? "").replace(",", "."));
      return isNaN(n) ? padrao : n;
    };
    const { data: cfg } = await supabase.from("configuracoes").select("*")
      .in("chave", ["taxa_entrega", "pedido_minimo"]);
    const conf = Object.fromEntries((cfg || []).map(r => [r.chave, r.valor]));
    const TAXA = num(conf.taxa_entrega, 3);
    const MINIMO = num(conf.pedido_minimo, 20);
    $("taxa").textContent = TAXA > 0 ? brl(TAXA) : "Grátis";
    $("info").textContent =
      `Entrega ${TAXA > 0 ? "de " + brl(TAXA) : "grátis"} para qualquer bairro da cidade. ` +
      `Pedido mínimo: ${brl(MINIMO)} em produtos.`;

    // --- sessão e dados salvos do cliente ---
    const { data: { session } } = await supabase.auth.getSession();
    if (session) {
      const { data: perfil } = await supabase.from("profiles")
        .select("endereco, telefone, bairro").eq("id", session.user.id).single();
      $("endereco").value = perfil?.endereco ?? "";
      $("telefone").value = perfil?.telefone ?? "";
      $("bairro").value = perfil?.bairro ?? "";
    }

    // --- produtos do pedido (preço e disponibilidade atuais) ---
    const ids = Object.keys(carrinho).map(Number);
    let produtos = [];
    if (ids.length) {
      const { data } = await supabase.from("produtos").select("*")
        .in("id", ids).eq("ativo", true);
      produtos = data || [];
    }
    let removidos = 0;
    for (const id of Object.keys(carrinho)) {
      if (!produtos.find(p => p.id == id)) { delete carrinho[id]; removidos++; }
    }
    if (removidos) {
      salvar();
      $("aviso").textContent = "Alguns itens não estão mais disponíveis e foram retirados do pedido.";
    }

    // --- cupom ---
    let cupom = null;   // { codigo, desconto }

    function subtotalAtual() {
      let s = 0;
      for (const [id, l] of Object.entries(carrinho)) {
        const p = produtos.find(x => x.id == id);
        if (p) s += Number(p.preco) * l.q;
      }
      return s;
    }

    async function aplicarCupom(silencioso = false) {
      const codigo = $("cupom").value.trim().toUpperCase();
      if (!codigo) { cupom = null; $("msgCupom").textContent = ""; return resumo(); }
      if (!session) {
        if (!silencioso) $("msgCupom").textContent = "Entre na sua conta para usar um cupom.";
        return;
      }
      const { data, error } = await supabase.rpc("validar_cupom",
        { p_codigo: codigo, p_subtotal: subtotalAtual() });
      if (error) {
        cupom = null;
        $("msgCupom").textContent = traduzirErro(error);
      } else {
        cupom = { codigo, desconto: Number(data) };
        $("msgCupom").textContent = `Cupom ${codigo} aplicado!`;
      }
      resumo();
    }
    $("aplicarCupom").onclick = () => aplicarCupom(false);

    // --- resumo e valor mínimo ---
    function resumo() {
      const sub = subtotalAtual();
      const desc = cupom ? Math.min(cupom.desconto, sub) : 0;
      $("subtotal").textContent = brl(sub);
      $("linhaDesconto").hidden = desc <= 0;
      $("desconto").textContent = "− " + brl(desc);
      $("total").textContent = brl(sub - desc + TAXA);

      const falta = MINIMO - sub;
      $("minimo").textContent = falta > 0.0001
        ? `Pedido mínimo de ${brl(MINIMO)} em produtos. Faltam ${brl(falta)}.` : "";
      $("finalizar").disabled = falta > 0.0001;
    }

    function desenhar() {
      const linhas = Object.entries(carrinho);
      $("vazio").hidden = linhas.length > 0;
      $("conteudo").hidden = linhas.length === 0;
      $("itens").innerHTML = linhas.map(([id, l]) => {
        const p = produtos.find(x => x.id == id);
        return `
          <div class="linha">
            <div class="linha-topo">
              <div><b>${esc(p.nome)}</b><br><small>${brl(p.preco)} cada</small></div>
              <div class="stepper">
                <button data-menos="${id}">−</button><span>${l.q}</span><button data-mais="${id}">+</button>
              </div>
              <b class="valor-linha">${brl(Number(p.preco) * l.q)}</b>
            </div>
            <input data-obs="${id}" maxlength="200" value="${esc(l.obs)}"
              placeholder="Observação deste item (ex.: sabor, bem gelada)">
            ${p.descricao ? `<small>${esc(p.descricao)}</small>` : ""}
          </div>`;
      }).join("");
      resumo();
    }

    // observação de cada item: salva enquanto digita
    document.addEventListener("input", e => {
      const id = e.target.dataset.obs;
      if (id && carrinho[id]) { carrinho[id].obs = e.target.value; salvar(); }
    });

    document.addEventListener("click", e => {
      const d = e.target.dataset;
      const id = d.mais || d.menos;
      if (!id || !carrinho[id]) return;
      carrinho[id].q += d.mais ? 1 : -1;
      if (carrinho[id].q <= 0) delete carrinho[id];
      salvar();
      desenhar();
      if (cupom) aplicarCupom(true);   // recalcula o desconto com o novo total
    });

    desenhar();

    // --- finalizar ---
    $("finalizar").onclick = async () => {
      if (!session) return (location.href = "login.html?volta=carrinho.html");
      const itens = Object.entries(carrinho).map(([id, l]) => ({
        produto_id: Number(id), quantidade: l.q, observacao: (l.obs || "").trim(),
      }));
      if (!itens.length) return alert("Seu pedido está vazio.");
      if (!$("bairro").value.trim()) return alert("Informe o seu bairro.");
      if (!$("endereco").value.trim()) return alert("Informe o endereço de entrega.");
      if (!$("telefone").value.trim()) return alert("Informe o telefone ou WhatsApp.");

      $("finalizar").disabled = true;
      const { data: id, error } = await supabase.rpc("criar_pedido", {
        p_itens: itens,
        p_bairro: $("bairro").value.trim(),
        p_endereco: $("endereco").value.trim(),
        p_telefone: $("telefone").value.trim(),
        p_observacao: $("obs").value.trim(),
        p_pagamento: $("pagamento").value,
        p_cupom: cupom ? cupom.codigo : null,
      });
      if (error) { resumo(); return alert(traduzirErro(error)); }

      await supabase.from("profiles").update({
        endereco: $("endereco").value.trim(),
        telefone: $("telefone").value.trim(),
        bairro: $("bairro").value.trim(),
      }).eq("id", session.user.id);

      carrinho = {}; salvar();
      location.href = "pedidos.html?novo=" + id;
    };
  </script>
</body>
</html>
